name: Playwright-AI-Framework CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: playwright-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright – ${{ matrix.browser }} – shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]
        shard: [ 1, 2 ]   # 2 shards per browser → 6 parallel jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --shard=${{ matrix.shard }}/2 \
            --reporter=html,line
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload traces & videos (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  ai-analysis:
    name: AI Failure Analysis
    needs: test
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download failed artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Run AI Failure Analyzer
        run: |
          node tools/ai-failure-analyzer.js ./artifacts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
